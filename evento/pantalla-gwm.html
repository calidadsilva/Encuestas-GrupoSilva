<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla stand GWM — Grupo Silva</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{border-top:1.2vh solid #c4161c;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#161c3d;color:#fff;overflow:hidden;
  background-image:radial-gradient(60vw 40vw at 105% -10%,rgba(247,197,49,.18),transparent 60%),radial-gradient(50vw 40vw at -10% 110%,rgba(184,36,44,.25),transparent 60%)}
.wrap{height:100vh;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:4vw;padding:5vh 4vw;align-items:center}
.plate{display:inline-block;background:#fff;border-radius:1.2vw;padding:1vw 1.6vw;line-height:0}
.plate img{height:7vh}
.k{margin-top:5vh;font-size:1.5vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#f7c531}
h1{font-size:7.2vw;line-height:.95;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin-top:1vh}
h1 em{font-style:normal;display:inline-block;background:#f7c531;color:#141830;padding:.06em .14em .02em;border-radius:.12em;margin-top:.08em}
ol{list-style:none;margin-top:5vh;display:grid;gap:1.8vh}
li{display:flex;align-items:center;gap:1.2vw;font-size:2vw;font-weight:600}
li b{flex:none;width:3vw;height:3vw;border-radius:50%;background:#fff;color:#161c3d;display:grid;place-items:center;font-size:1.5vw}
.cnt{margin-top:5vh;font-size:1.6vw;opacity:.85;display:none}
.cnt b{font-size:3.4vw;color:#f7c531;font-variant-numeric:tabular-nums;margin-right:.6vw}
.qrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw}
.qr{background:#f5f3ee;border-radius:2vw;padding:2.2vw;max-width:72vh;justify-self:center;width:100%;text-align:center;color:#232c5a}
.qr h2{font-size:3vw;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding-bottom:.8vw;margin-bottom:1.2vw;border-bottom:.4vw solid var(--c)}
.qr svg{width:100%;height:auto;display:block}
.qr p{font-size:1.6vw;font-weight:700;margin-top:1vw;letter-spacing:.06em;text-transform:uppercase}
@media (max-aspect-ratio:1/1){body{overflow:auto}.wrap{grid-template-columns:1fr;height:auto}.qrs{grid-template-columns:1fr}}
</style>
</head>
