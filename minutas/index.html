:root{
  --navy:#202F57; --red:#BE1622; --yel:#FEC800; --ink:#1F2430; --muted:#5F6675; --soft:#EEF1F7;
  --bg:#F7F8FB; --card:#FFFFFF; --line:#DCE1EC; --hl:#FFF3C4; --acc:#202F57; --onacc:#fff;
  --font:'Lato',Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--navy:#9FB2E6;--ink:#E8EBF3;--muted:#A5ADBF;--soft:#232A3D;--bg:#141824;--card:#1B2133;--line:#2C3550;--hl:#4A4116;--acc:#9FB2E6;--onacc:#141824}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0)) 16px 8px}
.bar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .lg{background:#fff;border-radius:10px;padding:4px;display:flex}
.brand img{height:34px;width:auto;display:block}
.brand b{display:block;font-size:15px;color:var(--navy);line-height:1.15}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;text-decoration:none;color:inherit}
.tab[aria-current=page]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.15;margin:0 0 4px;color:var(--navy)}
h2{font-size:18px;margin:26px 0 8px;color:var(--navy);padding-bottom:6px;border-bottom:2px solid var(--line)}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--yel);border-color:var(--yel);color:#202F57}
.btn.pri:hover{filter:brightness(.96)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:44px;line-height:1.45}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fld{margin-bottom:10px}
@media (max-width:600px){.g3{grid-template-columns:1fr 1fr}.g3>.wide{grid-column:1/-1}.g2.keep{grid-template-columns:1fr 1fr}.g2:not(.keep){grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 16px;font-weight:700;min-height:42px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--navy)}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.red b{color:var(--red)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.filters2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}.filters2{grid-template-columns:1fr 1fr}.filters2 .btn{grid-column:1/-1}}
.mc{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.mc:hover{border-color:var(--acc)}
.mc .t{font-weight:900;font-size:16.5px;color:var(--navy)}
.mc .m{font-size:13.5px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--navy);margin-right:4px}
.chip.y{background:var(--hl);color:var(--ink)}
.chip.r{background:var(--red);color:#fff}
.chip.g{background:#2E7D4F;color:#fff}
.rw{display:grid;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw.p{grid-template-columns:1.3fr 1fr auto auto}
.rw.s{grid-template-columns:1fr auto}
.rw.t{grid-template-columns:2fr 1fr 1fr 1fr auto}
@media (max-width:700px){.rw.p{grid-template-columns:1fr 1fr}.rw.p .chk{grid-column:1}.rw.p .x{grid-column:2;justify-self:end}.rw.t{grid-template-columns:1fr 1fr}.rw.t .tx{grid-column:1/-1}.rw.t .x{grid-column:1/-1;justify-self:end}}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;min-height:42px;white-space:nowrap}
.chk input{width:20px;height:20px}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;width:42px;height:42px;font-size:20px;line-height:1;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:110px 1fr}}
.pre{white-space:pre-wrap;margin:0}
ol.n{margin:0;padding-left:22px}ol.n li{margin-bottom:4px}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.tb th{color:var(--muted);font-size:12.5px}
.tk{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk .d{font-size:13px;color:var(--muted)}
.tk select{width:auto;min-width:130px;padding:8px 10px}
.banner{background:var(--hl);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14.5px}
.banner.err{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(30px);background:#202F57;color:#fff;border-radius:10px;padding:11px 18px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:92vw;font-weight:700;font-size:14.5px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}
.sticky-save{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0));margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.login{max-width:420px;margin:40px auto}
.pend{background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pend .d{font-size:13px;color:var(--muted)}
.pend .g3{margin-top:8px}
@media print{.bar,.row-btns,.toast{display:none}}
.tab.rec-launch{font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:6px}
.tab.rec-launch.on{border-color:var(--red);color:var(--red)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}.dot.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.rec{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:3px solid var(--red);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0))}
.rec[hidden]{display:none}.rec-in{max-width:720px;margin:0 auto}
.rec-t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px}.rec-st{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.rec-time{font-size:26px;font-variant-numeric:tabular-nums;color:var(--navy)}
.rec-p{margin:6px 0 10px;font-size:14px;color:var(--muted)}.rec-p.small{font-size:13px}.rec-e{color:var(--red);font-weight:700}
.rec-b{display:flex;gap:8px;flex-wrap:wrap}.rec-b .btn{flex:1 1 140px}
.rec-bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0}.rec-bar i{display:block;height:100%;background:var(--yel);transition:width .3s}
body.rec-on main{padding-bottom:210px}
.calma{position:fixed;inset:0;z-index:60;background:#0a0d13;color:#7d8699;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.calma[hidden]{display:none}.calma-in{display:flex;flex-direction:column;align-items:center;gap:14px}
.calma .rec-time{font-size:52px;color:#9aa3b6;font-weight:400}.calma-st{font-size:14px;letter-spacing:.08em;text-transform:uppercase}.calma-p{margin:0;font-size:13px;max-width:280px}
.calma-b{display:flex;gap:10px;margin-top:18px}.calma-b .btn{background:transparent;color:#9aa3b6;border:1px solid #2a3140;min-width:120px}

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function pad(n){return ('0'+n).slice(-2)}
function hoyLocal(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function sumaDias(iso,n){var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dfmt(iso){return /^\d{4}-\d{2}-\d{2}$/.test(iso||'')?iso.split('-').reverse().join('/'):(iso||'')}
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function dlargo(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return iso||'';var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return DIAS[d.getDay()]+' '+(+p[2])+' de '+MESES[+p[1]-1]+' de '+p[0]}
function uid(){return 't'+Math.random().toString(36).slice(2,8)}
function toast(msg,err){var t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='toast'},err?5000:2600)}
function opts(list,sel,vacio){return (vacio!==undefined?'<option value="">'+esc(vacio)+'</option>':'')+list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}

/* ---------- estado ---------- */
var S={minutas:[],cargado:false,hoy:hoyLocal(),f:{q:'',area:'',tipo:'',estado:'',desde:'',hasta:''},m:null,verHechas:false,tf:{area:'',resp:''},guardando:false};
function demo(){return !API_URL}

/* ---------- acceso a datos ---------- */
function demoApi(accion,d){
  var all=[];try{all=JSON.parse(store.get('minutas.demo')||'[]')}catch(e){all=[]}
  function grabar(){store.set('minutas.demo',JSON.stringify(all))}
  function sig(){var mx=0;all.forEach(function(m){var n=parseInt(String(m.id).replace(/\D/g,''),10);if(n>mx)mx=n});return 'MIN-'+('000'+(mx+1)).slice(-4)}
  if(accion==='listar')return Promise.resolve({ok:true,minutas:all,hoy:hoyLocal()});
  if(accion==='guardar'){var m=JSON.parse(JSON.stringify(d.minuta));var i=all.findIndex(function(x){return x.id===m.id});
    var now=hoyLocal()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
    if(i>=0){m.creada=all[i].creada;m.modificada=now;all[i]=m}else{m.id=sig();m.creada=now;m.modificada=now;all.push(m)}
    grabar();return Promise.resolve({ok:true,minuta:m})}
  if(accion==='tareas'){var out=[];d.cambios.forEach(function(c){var m=all.find(function(x){return x.id===c.mid});if(!m)return;var t=m.tareas.find(function(x){return x.id===c.tid});if(!t)return;
      if(c.estado!==undefined){t.estado=c.estado;t.cierre=c.estado==='Hecha'?hoyLocal():''}if(c.fecha!==undefined)t.fecha=c.fecha;if(out.indexOf(m)<0)out.push(m)});
    grabar();return Promise.resolve({ok:true,minutas:out})}
  return Promise.resolve({ok:false,error:'Acción desconocida'});
}
function api(accion,datos){
  if(demo())return demoApi(accion,datos||{});
  var cuerpo=Object.assign({clave:store.get('minutas.clave')||'',accion:accion},datos||{});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(cuerpo)}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){if(/clave/i.test(j.error||'')){store.del('minutas.clave')}throw new Error(j.error||'Error desconocido')}return j;
  },function(){throw new Error('No pude conectar con la planilla. Revisá la conexión e intentá de nuevo.')});
}
function ordenar(){S.minutas.sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'')||(b.horaIni||'').localeCompare(a.horaIni||'')||String(b.id).localeCompare(String(a.id))})}
function cargar(){
  return api('listar').then(function(j){S.minutas=j.minutas||[];S.hoy=hoyLocal();S.cargado=true;S.errorCarga='';ordenar()},function(e){S.cargado=true;S.errorCarga=e.message});
}
function reemplazar(ms){(ms||[]).forEach(function(m){var i=S.minutas.findIndex(function(x){return x.id===m.id});if(i>=0)S.minutas[i]=m;else S.minutas.push(m)});ordenar()}

/* ---------- modelo ---------- */
function nuevaMinuta(base){
  var m={id:'',fecha:hoyLocal(),horaIni:'',horaFin:'',modalidad:'Presencial',lugar:'',tipo:'Grupal',asunto:'',area:'',responsable:AUTOR,convoca:AUTOR,
    participantes:[{nombre:'',cargo:'',presente:true}],orden:[''],desarrollo:'',acuerdos:[],tareas:[],revision:[],proxima:{fecha:'',hora:'',tema:''},estado:'Borrador',obs:'',links:''};
  if(base){m.area=base.area;m.tipo=base.tipo;m.asunto='Seguimiento: '+base.asunto;m.convoca=base.convoca||AUTOR;m.responsable=base.responsable||AUTOR;m.modalidad=base.modalidad||'Presencial';m.lugar=base.lugar||'';
    m.participantes=base.participantes.map(function(p){return {nombre:p.nombre,cargo:p.cargo,presente:true}});if(!m.participantes.length)m.participantes=[{nombre:'',cargo:'',presente:true}]}
  return m;
}
function areasConocidas(){var s={};AREAS.forEach(function(a){s[a]=1});S.minutas.forEach(function(m){if(m.area)s[m.area]=1});return Object.keys(s).sort(function(a,b){return a.localeCompare(b,'es')})}
function tareasAbiertas(ms){var out=[];(ms||S.minutas).forEach(function(m){(m.tareas||[]).forEach(function(t){if(t.estado!=='Hecha')out.push({m:m,t:t})})});return out}
function vencida(t){return t.estado!=='Hecha'&&t.fecha&&t.fecha<S.hoy}
function filtradas(){
  var f=S.f,q=norm(f.q);
  return S.minutas.filter(function(m){
    if(f.area&&norm(m.area)!==norm(f.area))return false;
    if(f.tipo&&m.tipo!==f.tipo)return false;
    if(f.estado&&m.estado!==f.estado)return false;
    if(f.desde&&m.fecha<f.desde)return false;
    if(f.hasta&&m.fecha>f.hasta)return false;
    if(q){var h=norm([m.id,m.asunto,m.area,m.responsable,m.convoca,m.desarrollo,m.lugar,(m.participantes||[]).map(function(p){return p.nombre+' '+p.cargo}).join(' '),(m.orden||[]).join(' '),(m.acuerdos||[]).join(' '),(m.tareas||[]).map(function(t){return t.texto+' '+t.resp}).join(' ')].join(' '));
      if(h.indexOf(q)<0)return false}
    return true;
  });
}
function descFiltro(){var f=S.f,a=[];if(f.area)a.push('Área: '+f.area);if(f.tipo)a.push(f.tipo);if(f.q)a.push('Búsqueda: '+f.q);
  if(f.desde||f.hasta)a.push('Período: '+(f.desde?dfmt(f.desde):'inicio')+' al '+(f.hasta?dfmt(f.hasta):'hoy'));return a.join(' · ')}

/* ---------- vistas ---------- */
var app=$('#app');
function marcarTab(id){['lista','tareas','nueva'].forEach(function(k){var e=$('#t-'+k);if(k===id)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')})}
function ruta(){var h=location.hash.replace(/^#\/?/,'');var p=h.split('/');return {v:p[0]||'lista',id:p[1]||''}}
function render(){
  if(!demo()&&!store.get('minutas.clave')){return vistaLogin()}
  if(!S.cargado){app.innerHTML='<div class="empty">Abriendo la planilla…</div>';cargar().then(render);return}
  var r=ruta();
  window.scrollTo(0,0);
  if(r.v==='tareas'){marcarTab('tareas');return vistaTareas()}
  if(r.v==='nueva'){marcarTab('nueva');if(!S.m||S.m.id){S.m=nuevaMinuta()}return vistaEditor()}
  if(r.v==='m'){marcarTab('lista');return vistaDetalle(r.id)}
  if(r.v==='e'){marcarTab('nueva');var m=S.minutas.find(function(x){return x.id===r.id});if(!m){location.hash='#/';return}
    if(!S.m||S.m.id!==m.id)S.m=JSON.parse(JSON.stringify(m));return vistaEditor()}
  marcarTab('lista');vistaLista();
}
function vistaLogin(){
  marcarTab('');
  var msj=S.errorCarga&&/clave/i.test(S.errorCarga)?'<div class="banner err">'+esc(S.errorCarga)+'</div>':'';
  app.innerHTML='<div class="card login">'+msj+'<h1>Entrar</h1><p class="sub">Escribí la clave que pusiste en el script. Se guarda en este dispositivo.</p><div class="fld"><label class="f" for="clv">Clave</label><input type="password" id="clv" autocomplete="current-password"></div><button class="btn pri" id="ent" type="button">Entrar</button></div>';
  function ir(){var v=$('#clv').value.trim();if(!v)return;store.set('minutas.clave',v);S.cargado=false;S.errorCarga='';render()}
  $('#ent').onclick=ir;$('#clv').onkeydown=function(e){if(e.key==='Enter')ir()};
}

  var h='';
  if(demo())h+='<div class="banner">Modo de prueba: esta app todavía no está conectada a la planilla. Lo que cargues queda solo en este dispositivo.</div>';

  h+='<div class="filters"><div class="q"><label class="f" for="fq">Buscar</label><input type="search" id="fq" data-flt="q" placeholder="Área, persona, tema…" value="'+esc(f.q)+'"></div>'+
     '<div><label class="f" for="fa">Área</label><select id="fa" data-flt="area">'+opts(areasConocidas().filter(function(a){return S.minutas.some(function(m){return norm(m.area)===norm(a)})}),f.area,'Todas')+'</select></div>'+
     '<div><label class="f" for="ft">Tipo</label><select id="ft" data-flt="tipo">'+opts(['Individual','Grupal'],f.tipo,'Todos')+'</select></div>'+
     '<div><label class="f" for="fe">Estado</label><select id="fe" data-flt="estado">'+opts(['Borrador','Cerrada'],f.estado,'Todos')+'</select></div></div>';
  h+='<div class="filters2"><div><label class="f" for="fd">Desde</label><input type="date" id="fd" data-flt="desde" value="'+esc(f.desde)+'"></div><div><label class="f" for="fh">Hasta</label><input type="date" id="fh" data-flt="hasta" value="'+esc(f.hasta)+'"></div><button class="btn sm" data-act="limpiar" type="button">Limpiar filtros</button></div>';
  h+='<div class="row-btns"><a class="btn pri" href="#/nueva">Nueva minuta</a><button class="btn" data-act="wordSel" type="button"'+(L.length?'':' disabled')+'>Word de esta selección ('+L.length+')</button><button class="btn" data-act="actualizar" type="button">Actualizar</button></div>';
  h+='<div id="lst">'+listaHtml(L)+'</div>';

function listaHtml(L){
  if(!L.length)return '<div class="empty">'+(S.minutas.length?'Ninguna minuta coincide con los filtros.':'Todavía no cargaste minutas. Tocá “Nueva minuta” para empezar.')+'</div>';
  return L.map(function(m){
    var ab=(m.tareas||[]).filter(function(t){return t.estado!=='Hecha'}).length,ve=(m.tareas||[]).some(vencida);
    var pp=(m.participantes||[]).filter(function(p){return p.presente!==false}).map(function(p){return p.nombre});
    return '<a class="mc" href="#/m/'+esc(m.id)+'"><div class="t">'+esc(m.asunto)+'</div><div class="m">'+esc(dfmt(m.fecha))+(m.horaIni?' · '+esc(m.horaIni):'')+' · '+esc(m.area||'Sin área')+' · '+esc(m.tipo)+'</div>'+
      (pp.length?'<div class="m">Con: '+esc(pp.slice(0,4).join(', '))+(pp.length>4?' y '+(pp.length-4)+' más':'')+'</div>':'')+
      '<div style="margin-top:6px"><span class="chip">'+esc(m.id)+'</span>'+(m.estado==='Borrador'?'<span class="chip y">Borrador</span>':'')+(ab?'<span class="chip'+(ve?' r':' y')+'">'+ab+(ab===1?' tarea abierta':' tareas abiertas')+'</span>':((m.tareas||[]).length?'<span class="chip g">Tareas al día</span>':''))+'</div></a>';
  }).join('');
}
function vistaDetalle(id){
  var m=S.minutas.find(function(x){return x.id===id});
  if(!m){app.innerHTML='<div class="empty">No encontré esa minuta. <a href="#/">Volver</a></div>';return}
  var pres=(m.participantes||[]).filter(function(p){return p.presente!==false}),aus=(m.participantes||[]).filter(function(p){return p.presente===false});
  function pl(a){return a.map(function(p){return esc(p.nombre)+(p.cargo?' ('+esc(p.cargo)+')':'')}).join(', ')}
  var h=bannerModo()+'<p class="sub"><a href="#/">← Todas las minutas</a></p><h1>'+esc(m.asunto)+'</h1><p class="sub">'+esc(dlargo(m.fecha))+'</p>';
  h+='<div class="row-btns"><button class="btn pri" data-act="word" type="button">Descargar Word</button><button class="btn" data-act="compartir" type="button">Compartir</button><button class="btn" data-act="copiar" type="button">Copiar texto</button><a class="btn" href="#/e/'+esc(m.id)+'">Editar</a><button class="btn" data-act="seguimiento" type="button">Nueva reunión de seguimiento</button></div>';
  h+='<div class="card"><dl class="kv"><dt>Área</dt><dd>'+esc(m.area||'—')+'</dd><dt>Tipo</dt><dd>'+esc(m.tipo)+'</dd><dt>Horario</dt><dd>'+esc([m.horaIni,m.horaFin].filter(Boolean).join(' a ')||'—')+'</dd><dt>Modalidad</dt><dd>'+esc([m.modalidad,m.lugar].filter(Boolean).join(' · ')||'—')+'</dd><dt>Responsable</dt><dd>'+esc(m.responsable||'—')+'</dd><dt>Convocó</dt><dd>'+esc(m.convoca||'—')+'</dd><dt>Estado</dt><dd>'+esc(m.estado)+' · '+esc(m.id)+'</dd></dl></div>';
  if(pres.length||aus.length)h+='<h2>Participantes</h2><div class="card">'+(pres.length?'<p style="margin:0 0 6px"><b>Presentes:</b> '+pl(pres)+'</p>':'')+(aus.length?'<p style="margin:0"><b>Ausentes:</b> '+pl(aus)+'</p>':'')+'</div>';
  if((m.orden||[]).length)h+='<h2>Orden del día</h2><div class="card"><ol class="n">'+m.orden.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>';
  if(m.desarrollo)h+='<h2>Qué se habló</h2><div class="card"><p class="pre">'+esc(m.desarrollo)+'</p></div>';
  if((m.acuerdos||[]).length)h+='<h2>Acuerdos y decisiones</h2><div class="card"><ol class="n">'+m.acuerdos.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>';
  if((m.tareas||[]).length)h+='<h2>Tareas y compromisos</h2><div class="card">'+m.tareas.map(function(t){return '<div class="tk"><div><div>'+esc(t.texto)+'</div><div class="d">'+esc([t.resp,t.fecha?'Límite '+dfmt(t.fecha):'',t.cierre?'Cerrada '+dfmt(t.cierre):''].filter(Boolean).join(' · ')||'Sin responsable ni fecha')+(vencida(t)?' · <b style="color:var(--red)">Vencida</b>':'')+'</div></div><select data-tk="'+esc(m.id)+'|'+esc(t.id)+'" aria-label="Estado de la tarea">'+opts(ESTADOS_T,t.estado)+'</select></div>'}).join('')+'</div>';
  if((m.revision||[]).length)h+='<h2>Seguimiento de pendientes anteriores</h2><div class="card">'+m.revision.map(function(r){return '<div class="tk"><div><div>'+esc(r.texto)+'</div><div class="d">'+esc(r.resp||'')+(r.estadoAntes!==r.estadoDespues?' · '+esc(r.estadoAntes)+' → '+esc(r.estadoDespues):' · '+esc(r.estadoDespues))+(r.fechaDespues&&r.fechaDespues!==r.fechaAntes?' · nueva fecha '+esc(dfmt(r.fechaDespues)):'')+(r.nota?' · '+esc(r.nota):'')+'</div></div></div>'}).join('')+'</div>';
  if(m.proxima&&(m.proxima.fecha||m.proxima.tema))h+='<h2>Próxima reunión</h2><div class="card">'+esc([m.proxima.fecha?dlargo(m.proxima.fecha):'',m.proxima.hora].filter(Boolean).join(' · '))+(m.proxima.tema?'<p class="pre" style="margin-top:6px">'+esc(m.proxima.tema)+'</p>':'')+'</div>';
  if(m.obs)h+='<h2>Observaciones</h2><div class="card"><p class="pre">'+esc(m.obs)+'</p></div>';
  if(m.links)h+='<h2>Enlaces y adjuntos</h2><div class="card"><p class="pre">'+esc(m.links)+'</p></div>';
  app.innerHTML=h;
}
function vistaTareas(){
  var ab=tareasAbiertas();var todas=[];S.minutas.forEach(function(m){(m.tareas||[]).forEach(function(t){todas.push({m:m,t:t})})});
  var base=S.verHechas?todas:ab;
  var areas=[],resps=[];base.forEach(function(x){if(x.m.area&&areas.indexOf(x.m.area)<0)areas.push(x.m.area);if(x.t.resp&&resps.indexOf(x.t.resp)<0)resps.push(x.t.resp)});
  areas.sort();resps.sort();
  var tf=S.tf;if(tf.area&&areas.indexOf(tf.area)<0)tf.area='';if(tf.resp&&resps.indexOf(tf.resp)<0)tf.resp='';
  var L=base.filter(function(x){return (!tf.area||x.m.area===tf.area)&&(!tf.resp||x.t.resp===tf.resp)});
  var g={'Vencidas':[],'Próximos 7 días':[],'Más adelante':[],'Sin fecha':[],'Hechas':[]};
  var lim=sumaDias(S.hoy,7);
  L.forEach(function(x){var t=x.t;if(t.estado==='Hecha')g['Hechas'].push(x);else if(!t.fecha)g['Sin fecha'].push(x);else if(t.fecha<S.hoy)g['Vencidas'].push(x);else if(t.fecha<=lim)g['Próximos 7 días'].push(x);else g['Más adelante'].push(x)});
  Object.keys(g).forEach(function(k){g[k].sort(function(a,b){return (a.t.fecha||'9999').localeCompare(b.t.fecha||'9999')})});
  var h=bannerModo()+'<h1>Tareas</h1><p class="sub">Los compromisos de todas tus reuniones. Cambiá el estado acá y se actualiza en la planilla.</p>';
  h+='<div class="filters2" style="grid-template-columns:1fr 1fr"><div><label class="f" for="ta">Área</label><select id="ta" data-tf="area">'+opts(areas,tf.area,'Todas')+'</select></div><div><label class="f" for="tr">Responsable</label><select id="tr" data-tf="resp">'+opts(resps,tf.resp,'Todos')+'</select></div></div>';
  h+='<label class="chk" style="margin-bottom:8px"><input type="checkbox" data-act="hechas"'+(S.verHechas?' checked':'')+'> Mostrar también las hechas</label>';
  var hay=false;
  Object.keys(g).forEach(function(k){if(!g[k].length)return;hay=true;
    h+='<h2>'+k+' ('+g[k].length+')</h2><div class="card">'+g[k].map(function(x){var t=x.t,m=x.m;
      return '<div class="tk"><div><div>'+esc(t.texto)+'</div><div class="d">'+esc([t.resp,t.fecha?'Límite '+dfmt(t.fecha):'Sin fecha'].filter(Boolean).join(' · '))+' · <a href="#/m/'+esc(m.id)+'">'+esc(m.area?m.area+' · ':'')+esc(m.asunto)+' ('+esc(dfmt(m.fecha))+')</a></div></div><select data-tk="'+esc(m.id)+'|'+esc(t.id)+'" aria-label="Estado de la tarea">'+opts(ESTADOS_T,t.estado)+'</select></div>'}).join('')+'</div>'});
  if(!hay)h+='<div class="empty">No hay tareas para mostrar.</div>';
  app.innerHTML=h;
}

/* ---------- editor ---------- */
function field(label,id,html,cls){return '<div class="fld '+(cls||'')+'"><label class="f" for="'+id+'">'+label+'</label>'+html+'</div>'}
function vistaEditor(){
  var m=S.m;
  var h=bannerModo()+'<p class="sub"><a href="'+(m.id?'#/m/'+esc(m.id):'#/')+'">← Cancelar</a></p><h1>'+(m.id?'Editar minuta':'Nueva minuta')+'</h1><p class="sub">'+(m.id?esc(m.id)+' · ':'')+'Se guarda un borrador en este dispositivo mientras escribís.</p>';
  h+='<h2>Datos de la reunión</h2><div class="card">';

function guardar(){

  }).then(function(){
    var nid=savedId;store.del('minutas.borrador');S.m=null;S.guardando=false;
    toast(demo()?'Minuta guardada (modo de prueba)':'Minuta guardada en la planilla');

/* ---------- zip mínimo (sin compresión) ---------- */
function crc32(b){var t=crc32.t;if(!t){t=crc32.t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}
  var r=0xFFFFFFFF;for(var i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return (r^0xFFFFFFFF)>>>0}
function zipear(files){
  var enc=new TextEncoder(),parts=[],cent=[],off=0;
  function u16(n){return [n&255,(n>>8)&255]}
  function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255]}
  files.forEach(function(f){
    var nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    var lh=[0x50,0x4b,3,4].concat(u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,f.data);
    cent.push(new Uint8Array([0x50,0x4b,1,2].concat(u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),nm);
    off+=lh.length+nm.length+sz;
  });
  var cs=0;cent.forEach(function(c){cs+=c.length});
  var end=new Uint8Array([0x50,0x4b,5,6].concat(u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(off),u16(0)));
  return new Blob(parts.concat(cent,[end]),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

  }else if(R.est==='error'){
    h+='<div class="rec-t"><b>No se pudo guardar en Drive</b></div><p class="rec-p"><span class="rec-e">'+esc(R.err)+'</span> La grabación sigue en este dispositivo. Descargá la copia para no perderla.</p>'+
       '<div class="rec-b"><button class="btn pri" type="button" data-rec="copia">Descargar copia</button><button class="btn" type="button" data-rec="reintentar">Reintentar subida</button><button class="btn" type="button" data-rec="cerrar">Cerrar</button></div>';
  }
  panel.innerHTML=activo?h:h+'</div>';
}
function tictac(){var e=$('#rec-time');if(e)e.textContent=fmt(dur());if(lanz&&(R.est==='grabando'||R.est==='pausa'))lanz.lastChild&&(lanz.lastChild.textContent=' '+fmt(dur()))}

/* subida por partes */
function aBase64(blob){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){ok(String(fr.result).split(',')[1]||'')};fr.onerror=function(){no(new Error('No pude leer el audio'))};fr.readAsDataURL(blob)})}
function espera(ms){return new Promise(function(r){setTimeout(r,ms)})}
function subirParte(blob,ultimo){
  var intento=0;
  function una(){
    return aBase64(blob).then(function(b64){return api('audio_parte',{sid:R.sid,desde:R.subidos,datos:b64,ultimo:!!ultimo})}).then(function(j){R.subidos+=blob.size;if(ultimo){R.fin=true;R.idDrive=j.id||''}R.err=''},function(e){
      if(++intento<4)return espera(1500*intento).then(una);throw e});
  }
  return una();
}
function sacarParte(cola,min){ // junta bloques pendientes y devuelve un Blob de PARTE bytes si hay más de PARTE
  if(R.pendLen<=PARTE&&!min)return null;
  var junto=new Blob(R.pend,{type:R.mime||'audio/webm'});
  var parte=junto.slice(0,PARTE),resto=junto.slice(PARTE);
  R.pend=resto.size?[resto]:[];R.pendLen=resto.size;return parte;
}
function encolar(fn){R.cola=R.cola.then(fn).catch(function(e){R.err=e.message||String(e);if(R.est==='grabando'||R.est==='pausa'){pintar()}throw e});return R.cola}
function empujar(){
  if(demo()||!R.sid)return;
  var p;while((p=sacarParte())){(function(parte){encolar(function(){return subirParte(parte,false)}).catch(function(){})})(p)}
}

function iniciarSubida(){
  if(demo())return Promise.resolve();
  return api('audio_iniciar',{nombre:R.nombre}).then(function(j){R.sid=j.sid});
}
function empezar(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){R.err='Este navegador no permite grabar. Probá con Chrome o Safari, abriendo la app desde su dirección https.';pintar();return}
  var f=elegirFormato();R.mime=f.mime;R.ext=f.ext;
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(fl){
    R.flujo=fl;R.todo=[];R.pend=[];R.pendLen=0;R.subidos=0;R.total=0;R.sid='';R.err='';R.fin=false;R.cola=Promise.resolve();
    var d=new Date();R.nombre=nombreAudio(d,R.ext);
    return iniciarSubida().then(function(){
      var mr=new MediaRecorder(fl,R.mime?{mimeType:R.mime,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000});R.mr=mr;
      mr.ondataavailable=function(ev){if(ev.data&&ev.data.size){R.todo.push(ev.data);R.pend.push(ev.data);R.pendLen+=ev.data.size;R.total+=ev.data.size;empujar()}};
      mr.onerror=function(){R.err='La grabación se interrumpió.';pintar()};
      mr.onstop=terminar;
      mr.start(10000);R.acum=0;R.t0=Date.now();R.est='grabando';pedirPantalla();clearInterval(R.tick);R.tick=setInterval(tictac,500);pintar();
    });
  }).catch(function(e){
    if(R.flujo){R.flujo.getTracks().forEach(function(t){t.stop()});R.flujo=null}
    R.err=(e&&e.name==='NotAllowedError')?'El navegador no tiene permiso para usar el micrófono. Habilitalo en los permisos del sitio y volvé a intentar.':(e&&e.name==='NotFoundError')?'No encontré un micrófono en este dispositivo.':(e&&e.message)||'No pude empezar a grabar.';
    R.est='listo-para-grabar';pintar();
  });
}
function detener(){
  if(!R.mr||(R.est!=='grabando'&&R.est!=='pausa'))return;
  if(R.est==='grabando')R.acum+=Date.now()-R.t0;
  clearInterval(R.tick);soltarPantalla();R.est='subiendo';pintar();
  try{R.mr.stop()}catch(e){terminar()}
  if(R.flujo)R.flujo.getTracks().forEach(function(t){t.stop()});
}
function terminar(){
  if(!R.total){R.err='No se grabó nada de audio.';R.est='error';pintar();return}
  if(demo()){R.est='listo';pintar();return}
  var resto=new Blob(R.pend,{type:R.mime||'audio/webm'});R.pend=[];R.pendLen=0;
  R.cola=R.cola.then(function(){return subirFinal(resto)}).then(function(){R.est='listo';pintar()},function(e){R.err=e.message||String(e);R.est='error';pintar()});
}
function subirFinal(resto){
  // si quedó más de una parte, se envían de a una y la última lleva el cierre
  var partes=[];while(resto.size>PARTE){partes.push(resto.slice(0,PARTE));resto=resto.slice(PARTE)}
  partes.push(resto);
  return partes.reduce(function(p,b,i){return p.then(function(){return subirParte(b,i===partes.length-1)})},Promise.resolve());
}
function reintentar(){
  // reanuda desde lo ya subido: reconstruye lo que falta desde la copia completa
  var todo=new Blob(R.todo,{type:R.mime||'audio/webm'});
  var falta=todo.slice(R.subidos);R.est='subiendo';R.err='';pintar();
  R.cola=Promise.resolve().then(function(){return subirFinal(falta)}).then(function(){R.est='listo';pintar()},function(e){R.err=e.message||String(e);R.est='error';pintar()});
}
function copia(){
  var b=new Blob(R.todo,{type:R.mime||'audio/webm'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=R.nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000);
}
function cerrar(){
  if(R.est==='error'&&!R.fin&&!confirm('La grabación no se guardó en Drive. Si cerrás sin descargar la copia, se pierde. ¿Cerrar igual?'))return;
  R.est='cerrado';R.todo=[];R.pend=[];R.err='';R.sid='';pintar();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-rec]');if(!b)return;var a=b.dataset.rec;
  if(a==='abrir'){if(R.est==='cerrado'){R.est='listo-para-grabar';R.err='';pintar();panel.scrollIntoView({block:'end'})}return}
  if(a==='empezar'){empezar();return}
  if(a==='pausa'){if(R.est==='grabando'){R.mr.pause();R.acum+=Date.now()-R.t0;R.est='pausa'}else if(R.est==='pausa'){R.mr.resume();R.t0=Date.now();R.est='grabando'}pintar();return}
  if(a==='detener'){detener();return}
  if(a==='copia'){copia();return}
  if(a==='reintentar'){reintentar();return}
  if(a==='cerrar'){cerrar();return}
});
// el lanzador del encabezado
lanz.setAttribute('data-rec','abrir');
pintar();
window.__rec=R; // para pruebas
})();
</script>
