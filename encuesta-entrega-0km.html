<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Encuesta de Satisfacción — Grupo Silva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #2c3e50 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -15%;
            right: -8%;
            width: 800px;
            height: 800px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><defs><radialGradient id="dropGrad" cx="30%25" cy="30%25"><stop offset="0%25" style="stop-color:%23ffffff;stop-opacity:0.15" /><stop offset="100%25" style="stop-color:%23e74c3c;stop-opacity:0.05" /></radialGradient></defs><path d="M100 20C120 45, 180 120, 180 180C180 230, 150 280, 100 280C50 280, 20 230, 20 180C20 120, 80 45, 100 20Z" fill="url(%23dropGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }

        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 24px;
            margin: 0 auto;
            position: relative;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
            margin-top: -8px;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(44, 62, 80, 0.15));
        }

        .header-text {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-text h1 {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-text p {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 500;
        }

        .separator {
            height: 3px;
            background: linear-gradient(90deg, transparent, #27ae60, transparent);
            margin-bottom: 28px;
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.4;
        }

        .form-group label .required {
            color: #e74c3c;
            font-weight: 700;
            margin-left: 2px;
        }

        .form-group.hidden {
            display: none;
        }

        .text-input {
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #2c3e50;
            transition: all 0.2s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #27ae60;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }

        .text-input::placeholder {
            color: #bdc3c7;
        }

        .scale-group {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .scale-group input[type="radio"] {
            display: none;
        }

        .scale-group label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 6px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: white;
            color: #666;
            transition: all 0.2s ease;
            margin: 0;
            line-height: 1.2;
        }

        .scale-group label:hover {
            transform: translateY(-2px);
            border-width: 2.5px;
        }

        .scale-group input[value="1"] + label,
        .scale-group input[value="2"] + label {
            border-color: #e74c3c;
            background: #fff5f3;
        }

        .scale-group input[value="1"]:checked + label,
        .scale-group input[value="2"]:checked + label {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .scale-group input[value="3"] + label,
        .scale-group input[value="4"] + label {
            border-color: #f39c12;
            background: #fffbf0;
        }

        .scale-group input[value="3"]:checked + label,
        .scale-group input[value="4"]:checked + label {
            background: #f39c12;
            color: white;
            border-color: #f39c12;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .scale-group input[value="5"] + label {
            border-color: #27ae60;
            background: #f0fdf4;
        }

        .scale-group input[value="5"]:checked + label {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        textarea {
            font-family: inherit;
            font-size: 14px;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            resize: vertical;
            min-height: 100px;
            color: #2c3e50;
            transition: all 0.2s ease;
            background: white;
        }

        textarea:focus {
            outline: none;
            border-color: #27ae60;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }

        textarea::placeholder {
            color: #bdc3c7;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: space-between;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.25);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            flex: 0.4;
            background: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #ddd;
        }

        .btn-reset:hover {
            border-color: #27ae60;
            background: #f0fdf4;
            color: #27ae60;
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
            border-radius: 12px;
            padding: 32px 24px;
            margin-bottom: 24px;
            color: #155724;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
            font-size: 16px;
            line-height: 1.6;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-indicator {
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            margin-top: 20px;
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            font-family: inherit;
        }

        .modal-input:focus {
            outline: none;
            border-color: #27ae60;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-buttons .btn-ok {
            background: #27ae60;
            color: white;
        }

        .modal-buttons .btn-ok:hover {
            background: #229954;
        }

        .modal-buttons .btn-cancel {
            background: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #ddd;
        }

        .modal-buttons .btn-cancel:hover {
            border-color: #27ae60;
        }

        @media (max-width: 540px) {
            body { padding: 12px; }
            .container { padding: 28px 18px; }
            .logo-img { width: 90px; height: 90px; }
            .header-text h1 { font-size: 22px; }
            .scale-group label { padding: 10px 4px; font-size: 12px; }
            button { padding: 12px 16px; font-size: 13px; }
        }

        @media (max-width: 380px) {
            .container { padding: 20px 14px; }
            .button-group { flex-direction: column; gap: 10px; }
            button { width: 100%; flex: 1; }
            .btn-reset { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="logo-section">
                <img class="logo-img" src="https://i.ibb.co/VYKCx3C5/silva-innovando-la-construccin-logo.jpg" alt="Grupo Silva" />
            </div>

            <div class="header-text">
                <h1>¿Cómo fue tu experiencia?</h1>
                <p>Tu opinión nos ayuda a mejorar</p>
            </div>

            <div class="separator"></div>

            <div class="success-message" id="successMessage">
                <strong>✓ ¡Gracias por tu tiempo!</strong><br>Tu opinión nos ayuda a mejorar cada experiencia. Un gusto tenerte como cliente de Grupo Silva.
            </div>

            <form id="encuestaForm" action="https://script.google.com/macros/s/AKfycbzzkPAsJAB6E-uaTo160GYL9yAGyose_XiEoOe0Bm9O-YVFYmSN_eO8Ixxn50JeJGhA/exec" method="POST">
                <!-- Datos de contacto -->
                <div class="form-group">
                    <label>Nombre y Apellido <span class="required">*</span></label>
                    <input type="text" name="nombre" class="text-input" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label>Teléfono <span class="required">*</span></label>
                    <input type="tel" name="telefono" class="text-input" placeholder="Ej: 381-1234567" required>
                </div>

                <div class="form-group">
                    <label>Marca de moto <span class="required">*</span></label>
                    <input type="text" name="marca" class="text-input" placeholder="Ej: Triumph, Benelli" required>
                </div>

                <div class="form-group">
                    <label>Modelo <span class="required">*</span></label>
                    <input type="text" name="modelo" class="text-input" placeholder="Ej: Street Twin, Imperiale" required>
                </div>

                <div class="form-group">
                    <label>¿Quién te atendió? <span class="required">*</span></label>
                    <input type="text" name="vendedor" class="text-input" placeholder="Nombre del vendedor" required>
                </div>

                <!-- Preguntas de satisfacción -->
                <div class="form-group">
                    <label>¿Cómo calificas el asesoramiento brindado? <span class="required">*</span></label>
                    <div class="scale-group">
                        <input type="radio" id="asesoramiento_1" name="asesoramiento" value="1" required>
                        <label for="asesoramiento_1">1</label>
                        <input type="radio" id="asesoramiento_2" name="asesoramiento" value="2">
                        <label for="asesoramiento_2">2</label>
                        <input type="radio" id="asesoramiento_3" name="asesoramiento" value="3">
                        <label for="asesoramiento_3">3</label>
                        <input type="radio" id="asesoramiento_4" name="asesoramiento" value="4">
                        <label for="asesoramiento_4">4</label>
                        <input type="radio" id="asesoramiento_5" name="asesoramiento" value="5">
                        <label for="asesoramiento_5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Algo a destacar sobre el asesoramiento?</label>
                    <textarea name="asesoramiento_comentario" placeholder="Comentario opcional..."></textarea>
                </div>

                <div class="form-group">
                    <label>¿Fue clara la información sobre tu moto? <span class="required">*</span></label>
                    <div class="scale-group">
                        <input type="radio" id="claridad_1" name="claridad" value="1" required>
                        <label for="claridad_1">1</label>
                        <input type="radio" id="claridad_2" name="claridad" value="2">
                        <label for="claridad_2">2</label>
                        <input type="radio" id="claridad_3" name="claridad" value="3">
                        <label for="claridad_3">3</label>
                        <input type="radio" id="claridad_4" name="claridad" value="4">
                        <label for="claridad_4">4</label>
                        <input type="radio" id="claridad_5" name="claridad" value="5">
                        <label for="claridad_5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Algo a comentar sobre la claridad?</label>
                    <textarea name="claridad_comentario" placeholder="Comentario opcional..."></textarea>
                </div>

                <div class="form-group">
                    <label>¿Cómo fue el proceso de compra en cuanto a plazos? <span class="required">*</span></label>
                    <div class="scale-group">
                        <input type="radio" id="plazos_1" name="plazos" value="1" required>
                        <label for="plazos_1">1</label>
                        <input type="radio" id="plazos_2" name="plazos" value="2">
                        <label for="plazos_2">2</label>
                        <input type="radio" id="plazos_3" name="plazos" value="3">
                        <label for="plazos_3">3</label>
                        <input type="radio" id="plazos_4" name="plazos" value="4">
                        <label for="plazos_4">4</label>
                        <input type="radio" id="plazos_5" name="plazos" value="5">
                        <label for="plazos_5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Algo a comentar sobre los plazos?</label>
                    <textarea name="plazos_comentario" placeholder="Comentario opcional..."></textarea>
                </div>

                <div class="form-group">
                    <label>¿Cómo fue la experiencia de entrega? <span class="required">*</span></label>
                    <div class="scale-group">
                        <input type="radio" id="entrega_1" name="entrega" value="1" required>
                        <label for="entrega_1">1</label>
                        <input type="radio" id="entrega_2" name="entrega" value="2">
                        <label for="entrega_2">2</label>
                        <input type="radio" id="entrega_3" name="entrega" value="3">
                        <label for="entrega_3">3</label>
                        <input type="radio" id="entrega_4" name="entrega" value="4">
                        <label for="entrega_4">4</label>
                        <input type="radio" id="entrega_5" name="entrega" value="5">
                        <label for="entrega_5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Algo a comentar sobre la entrega?</label>
                    <textarea name="entrega_comentario" placeholder="Comentario opcional..."></textarea>
                </div>

                <div class="form-group">
                    <label>¿Cómo fue el servicio de instalaciones? <span class="required">*</span></label>
                    <div class="scale-group">
                        <input type="radio" id="instalaciones_1" name="instalaciones" value="1" required>
                        <label for="instalaciones_1">1</label>
                        <input type="radio" id="instalaciones_2" name="instalaciones" value="2">
                        <label for="instalaciones_2">2</label>
                        <input type="radio" id="instalaciones_3" name="instalaciones" value="3">
                        <label for="instalaciones_3">3</label>
                        <input type="radio" id="instalaciones_4" name="instalaciones" value="4">
                        <label for="instalaciones_4">4</label>
                        <input type="radio" id="instalaciones_5" name="instalaciones" value="5">
                        <label for="instalaciones_5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Algo a comentar sobre las instalaciones?</label>
                    <textarea name="instalaciones_comentario" placeholder="Comentario opcional..."></textarea>
                </div>

                <div class="form-group">
                    <label>¿Nos recomendarías y volverías a comprar? (NPS) <span class="required">*</span></label>
                    <div class="scale-group">
                        <input type="radio" id="recomendacion_1" name="recomendacion" value="1" required>
                        <label for="recomendacion_1">1</label>
                        <input type="radio" id="recomendacion_2" name="recomendacion" value="2">
                        <label for="recomendacion_2">2</label>
                        <input type="radio" id="recomendacion_3" name="recomendacion" value="3">
                        <label for="recomendacion_3">3</label>
                        <input type="radio" id="recomendacion_4" name="recomendacion" value="4">
                        <label for="recomendacion_4">4</label>
                        <input type="radio" id="recomendacion_5" name="recomendacion" value="5">
                        <label for="recomendacion_5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Algo a comentar sobre la recomendación?</label>
                    <textarea name="recomendacion_comentario" placeholder="Comentario opcional..."></textarea>
                </div>

                <div class="form-group">
                    <label>¿Algo más que quieras decirnos?</label>
                    <textarea name="comentario" placeholder="Comentario final (opcional)..."></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Enviar →</button>
                    <button type="reset" class="btn-reset">Limpiar</button>
                </div>
            </form>

            <div class="progress-indicator">
                Tus datos son anónimos y seguros
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('encuestaForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(form);
            
            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    form.style.display = 'none';
                    successMessage.classList.add('show');
                    
                    setTimeout(() => {
                        form.reset();
                        form.style.display = 'flex';
                        successMessage.classList.remove('show');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }, 3500);
                } else {
                    alert('Error al enviar: ' + (data.msg || 'Error desconocido'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al enviar la encuesta');
            });
        });
    </script>
</body>
</html>
